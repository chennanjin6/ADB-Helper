name: Build ADB Bridge Debug APK
on:
  push:
    branches: [ "feature/cloudflare-adb-bridge" ]
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Prepare wrapper and debug signing key
        run: |
          if [ ! -f gradlew ]; then gradle wrapper; fi
          chmod +x gradlew
          keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" -noprompt
      - name: Build debug APK
        run: ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: adb-helper-cloudflare-bridge-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
